name: Sync Upstream SourceForge

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Sync Master branch with Upstream
        run: |
          # Configure Git
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # Add SourceForge as upstream
          git remote add upstream https://git.code.sf.net/p/opencamera/code || true
          git fetch upstream

          # Switch to master and hard reset to match SourceForge exactly
          git checkout master
          git reset --hard upstream/master

          # Force push to GitHub's master branch
          git push origin master --force

      - name: Rebase AnaCam branch on updated Master
        run: |
          # Checkout AnaCam branch
          git checkout AnaCam || git checkout -b AnaCam origin/AnaCam

          # Rebase on top of the updated master
          git rebase master || {
            echo "Rebase failed - conflicts need manual resolution"
            exit 1
          }

          # Force push the rebased AnaCam branch
          git push origin AnaCam --force
